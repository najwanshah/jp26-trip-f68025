<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Japan 2026">
<meta name="theme-color" content="#1d3566">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Japan 2026</title>
<style>
:root{--bg:#1d3566;--card:#ffffff;--fg:#141e2c;--muted:#5c6878;--accent:#23407a;--err:#b3261e}
@media (prefers-color-scheme: dark){:root{--card:#18212d;--fg:#e8edf4;--muted:#9aa7b8;--accent:#8fb0ec;--err:#ff8a80}}
html,body{height:100%;margin:0}
body{background:var(--bg);font:16px/1.5 -apple-system,system-ui,"Segoe UI",sans-serif;display:grid;place-items:center;
  padding:env(safe-area-inset-top) max(16px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(16px,env(safe-area-inset-left))}
main{background:var(--card);color:var(--fg);border-radius:18px;padding:28px 24px;width:min(360px,100%);box-sizing:border-box;text-align:center}
img{width:72px;height:72px;border-radius:16px}
h1{font-size:22px;margin:12px 0 4px}
p{margin:0 0 16px;color:var(--muted);font-size:14px}
form{display:grid;gap:10px}
input{font:inherit;padding:12px;border:1px solid var(--muted);border-radius:10px;background:transparent;color:var(--fg)}
button{font:inherit;font-weight:600;padding:12px;border:0;border-radius:10px;background:var(--accent);color:var(--card)}
#msg{min-height:1.5em;margin:4px 0 0;color:var(--err)}
</style>
</head>
<body>
<main id="lock" hidden>
  <img src="icon-192.png" alt="">
  <h1>Japan 2026</h1>
  <p>Enter the trip passcode. This iPad remembers it.</p>
  <form id="f">
    <label for="pw" hidden>Passcode</label>
    <input id="pw" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Passcode" required>
    <button id="go" type="submit">Open</button>
  </form>
  <p id="msg"></p>
</main>
<script>
/* build eecdf1a8 */
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
var KEY = 'jp26-passcode';
function b64(s){ return Uint8Array.from(atob(s), function(c){ return c.charCodeAt(0); }); }
async function unlock(pw){
  var blob = await (await fetch('data.json')).json();
  var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  var key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(blob.salt), iterations:blob.iter, hash:'SHA-256'},
                                          base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  var plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(blob.iv)}, key, b64(blob.ct));
  return new TextDecoder().decode(plain);
}
function show(html){ document.open(); document.write(html); document.close(); }
function ask(text){
  document.getElementById('lock').hidden = false;
  document.getElementById('msg').textContent = text || '';
  document.getElementById('pw').focus();
}
document.getElementById('f').addEventListener('submit', async function(e){
  e.preventDefault();
  var pw = document.getElementById('pw').value.trim().toLowerCase();
  var btn = document.getElementById('go'); btn.disabled = true; btn.textContent = 'Opening…';
  try {
    var html = await unlock(pw);
    try { localStorage.setItem(KEY, pw); } catch (_) {}
    show(html);
  } catch (err) {
    btn.disabled = false; btn.textContent = 'Open';
    ask(err && err.name === 'OperationError' ? 'Wrong passcode. Try again.' : 'Could not load the trip. Connect to the internet once and try again.');
  }
});
(async function(){
  var saved = null; try { saved = localStorage.getItem(KEY); } catch (_) {}
  if (!saved) return ask();
  try { show(await unlock(saved)); } catch (err) { ask(err && err.name === 'OperationError' ? '' : 'Could not load the trip. Connect to the internet once and try again.'); }
})();
</script>
</body>
</html>
